name: Build and validate homepage

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JavaScript
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Check whether GitHub Pages can be enabled
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          curl -sS -o /tmp/pages-response.txt -w 'Pages API HTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GH_REPO}/pages" \
            -d '{"build_type":"workflow"}'
          cat /tmp/pages-response.txt
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Validate personal content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          about = Path('_site/index.html').read_text()
          publications = Path('_site/publications/index.html').read_text()
          titles = [
              'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond',
              'On the Perception Bottleneck of VLMs for Chart Understanding',
              'On the Universal Truthfulness Hyperplane Inside LLMs',
              'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation',
              'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models',
              'Composing Parameter-Efficient Modules with Arithmetic Operations',
          ]
          for title in titles:
              assert title in about, f'Missing from About: {title}'
              assert title in publications, f'Missing from Publications: {title}'
          for token in ['jliugi@connect.ust.hk', 'https://github.com/Vicent0205', 'tbK9jl4AAAAJ', 'junteng88716710', 'Zhiyuan Honor Scholarship', 'MINIMAX', 'Tencent WXG', 'Shanghai AI Lab']:
              assert token in about, f'Missing from About: {token}'
          for placeholder in ['Paper Title Number', 'Your Name', 'Red Brick University', 'none@example.org', 'GitHub University']:
              assert placeholder not in about, f'Placeholder in About: {placeholder}'
              assert placeholder not in publications, f'Placeholder in Publications: {placeholder}'
          assert '/publication/' not in about, 'Unexpected publication detail link in About'
          match = re.search(r'<ul class="publication-list">.*?</ul>', about, re.S)
          print(match.group(0) if match else 'Publication list not found')
          print('Validated all six publications on About and Publications, plus contact and background details.')
          PY
